name: BugPatrol CI feedback

# React to the project's own PR CI finishing on ANY PR that closes a
# BugPatrol-managed issue -- a bugpatrol auto-fix PR (bugpatrol/fix-issue-N) or
# a human's manual-fix PR that cites `Fixes #N`. The tool resolves the managed
# issue from the PR's closing-issue reference (association), so results reach the
# reporter's topic regardless of who opened the PR. One workflow_run [completed]
# listener, two branches off the run's conclusion:
#   - failure on a bugpatrol fix branch -> CI-fix: feed the failing logs to the
#     revise agent, edit, push a fast-forward update, bounded by
#     [fix.gate].max_ci_fix_attempts; at the cap it escalates to the PR reviewer.
#   - failure on a human branch -> notify the topic only (BugPatrol does not
#     revise a branch it does not own).
#   - success -> build-ready: the build is clean and testable, so surface the PR
#     to the issue + the reporter's Lark topic, @ the assignee.
# De-dupes on head_sha (one push -> many failed workflows -> many events) via a
# BUGPATROL_CI_FIX_META PR comment.
#
# BugPatrol only reads the CI *result surface* (a workflow's conclusion + its
# failed-step logs), never the project's build definition.
#
# NOTE: workflow_run only fires from the copy of this file on the DEFAULT branch,
# and `workflows:` must be STATIC strings. Replace the placeholder names below
# with this project's real build-workflow names before deploying.

on:
  workflow_run:
    workflows:
      # >>> REPLACE with this project's real build-workflow names <<<
      - "REPLACE ME iOS Build"
      - "REPLACE ME Android Build"
      - "REPLACE ME Web Build"
      - "REPLACE ME API Tests"
      - "REPLACE ME E2E Tests"
    types: [completed]

# Share the fix concurrency group so fix / revise / ci-fix for the SAME issue
# never run at once, even across runners. Serialization + sha-keyed meta => at
# most one reaction per commit. Do NOT cancel-in-progress: a cancelled half-run
# could push without recording its de-dupe marker.
concurrency:
  group: bugpatrol-fix-${{ github.repository }}-ci-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  ci-feedback:
    # Act on any PR build that concluded success or failure (neutral / cancelled
    # / skipped are no-ops). The tool resolves whether the PR closes a managed
    # issue and no-ops otherwise, so no branch-name gate is needed here.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ${{ vars.BUGPATROL_FIX_RUNNER_LABEL || 'self-hosted' }}
    env:
      NODE_USE_ENV_PROXY: "1"
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUGPATROL_APP_ID }}
          private-key: ${{ secrets.BUGPATROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout BugPatrol tool
        uses: actions/checkout@v5
        with:
          repository: verneagent/bugpatrol
          path: .bugpatrol/tool

      - name: Bootstrap app repo cache
        id: app-cache
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          repo_path="$(bash "$GITHUB_WORKSPACE/.bugpatrol/tool/examples/github-actions/bugpatrol-cache-bootstrap.sh" "${{ github.repository }}")"
          echo "repo_path=$repo_path" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        shell: bash
        run: |
          git -C "${{ steps.app-cache.outputs.repo_path }}" config user.name "bugpatrol[bot]"
          git -C "${{ steps.app-cache.outputs.repo_path }}" config user.email "bugpatrol[bot]@users.noreply.github.com"

      - name: React to CI result
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUGPATROL_PROJECT_CONFIG: ${{ vars.BUGPATROL_PROJECT_CONFIG }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO_PATH: ${{ steps.app-cache.outputs.repo_path }}
        run: |
          PY=""
          for c in python3.13 python3.12 python3.11 python3; do
            if command -v "$c" >/dev/null 2>&1 \
              && "$c" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'; then
              PY="$c"; break
            fi
          done
          [ -n "$PY" ] || { echo "no Python >= 3.11 on this runner" >&2; exit 1; }
          PYTHONPATH="$GITHUB_WORKSPACE/.bugpatrol/tool" \
          "$PY" -m bugpatrol run-ci-feedback "$BUGPATROL_PROJECT_CONFIG" \
            --head-branch "$HEAD_BRANCH" \
            --head-sha "$HEAD_SHA" \
            --conclusion "$CONCLUSION" \
            --repo-path "$REPO_PATH" \
            --output-dir "$GITHUB_WORKSPACE/.bugpatrol/ci-fix/$HEAD_SHA" \
            --execute
