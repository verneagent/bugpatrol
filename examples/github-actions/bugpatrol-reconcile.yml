name: BugPatrol reconcile

# Periodic safety net for events the live watchers/webhooks missed:
#   - triage-reconcile: intook issues that never produced a triage result.
#     Each candidate is dispatched through its own bugpatrol-triage run (fresh
#     App token per run) rather than triaged in-process under one job-lifetime
#     token, which expired mid-batch on >~7 candidates.
#   - notify-reconcile: fix events (merged PRs, closed managed issues, linked
#     commits) that never fired a Lark fix notification.
# Both jobs are idempotent — already-covered items are skipped downstream via
# BUGPATROL_INTAKE_META / BUGPATROL_FIX_META — so re-runs are safe.

on:
  schedule:
    # Every 6 hours, offset. Keep it coarse to bound API usage.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Which reconcile to run
        required: false
        default: both
        type: choice
        options:
          - both
          - triage
          - notify
      write:
        description: Apply changes (post comments / send Lark). Off = dry run.
        required: false
        default: true
        type: boolean

concurrency:
  group: bugpatrol-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  triage-reconcile:
    if: >-
      github.event_name == 'schedule' ||
      inputs.target == 'both' || inputs.target == 'triage'
    runs-on: ${{ vars.BUGPATROL_TRIAGE_RUNNER_LABEL || 'self-hosted' }}
    # create-github-app-token's Node fetch ignores http(s)_proxy unless this is
    # set; required on proxied self-hosted runners. Harmless otherwise.
    env:
      NODE_USE_ENV_PROXY: "1"
    steps:
      # Same in-workflow token + per-runner cache clone as bugpatrol-triage.yml.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUGPATROL_APP_ID }}
          private-key: ${{ secrets.BUGPATROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout BugPatrol tool
        uses: actions/checkout@v5
        with:
          repository: verneagent/bugpatrol
          path: .bugpatrol/tool

      # Reconcile dispatches one bugpatrol-triage workflow run per candidate
      # (each run mints its own fresh App token), so no app-repo checkout or
      # DEEPSEEK/LARK credentials are needed here — the tool clone only provides
      # the CLI that fires the dispatches.
      - name: Reconcile triage
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUGPATROL_PROJECT_CONFIG: ${{ vars.BUGPATROL_PROJECT_CONFIG }}
        run: |
          args=(
            "$BUGPATROL_PROJECT_CONFIG"
          )
          # Scheduled runs always apply; manual runs honor the write toggle.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.write }}" == "true" ]]; then
            args+=(--execute)
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/.bugpatrol/tool" \
          python3 -m bugpatrol reconcile-triage "${args[@]}"

  notify-reconcile:
    if: >-
      github.event_name == 'schedule' ||
      inputs.target == 'both' || inputs.target == 'notify'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout BugPatrol tool
        uses: actions/checkout@v5
        with:
          repository: verneagent/bugpatrol
          path: .bugpatrol/tool

      - name: Reconcile fix notifications
        env:
          GH_TOKEN: ${{ secrets.BUGPATROL_GH_TOKEN || github.token }}
          BUGPATROL_PROJECT_CONFIG: ${{ vars.BUGPATROL_PROJECT_CONFIG }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          args=(
            "$BUGPATROL_PROJECT_CONFIG"
            --from-github
            # Periodic safety net: only backfill fixes from the last 2 weeks.
            # Older events were either already notified live or covered by an
            # earlier reconcile; a bounded window keeps API calls finite.
            --since-days 14
          )
          # Scheduled runs always apply; manual runs honor the write toggle.
          if [[ "${{ github.event_name }}" == "schedule" || "${{ inputs.write }}" == "true" ]]; then
            args+=(--write)
          fi
          PYTHONPATH="$GITHUB_WORKSPACE/.bugpatrol/tool" \
          python3 -m bugpatrol reconcile-fix-notifications "${args[@]}"
