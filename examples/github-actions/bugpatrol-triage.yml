name: BugPatrol triage

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number to triage
        required: true
      trigger_fingerprint:
        description: Debounce/idempotency fingerprint from the watcher
        required: false
        default: ""
      reason:
        description: Why this triage was requested
        required: false
        default: "manual"

concurrency:
  group: bugpatrol-triage-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ${{ vars.BUGPATROL_TRIAGE_RUNNER_LABEL || 'self-hosted' }}
    # actions/create-github-app-token runs on Node, whose native fetch ignores
    # http(s)_proxy unless this is set. On a proxied self-hosted runner the mint
    # step otherwise fails with "a proxy environment variable is set, but Node.js
    # native proxy support is not enabled". Harmless on non-proxied runners.
    env:
      NODE_USE_ENV_PROXY: "1"
    steps:
      # Mint a short-lived installation token in-workflow. No private key on the
      # runner disk, no gh-bot-token.sh fallback. App id + private key live only
      # in Actions secrets. Grants access to the app repo (and any reference
      # repos on the same installation) for the duration of the job.
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BUGPATROL_APP_ID }}
          private-key: ${{ secrets.BUGPATROL_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          # Extend `repositories` if triage reads reference repos, e.g.
          # repositories: |
          #   ${{ github.event.repository.name }}
          #   backend

      # BugPatrol is public, so no token is needed to fetch the tool itself.
      - name: Checkout BugPatrol tool
        uses: actions/checkout@v5
        with:
          repository: verneagent/bugpatrol
          path: .bugpatrol/tool

      # Runner-owned, per-runner cache clone of the app repo (full history,
      # tokenless origin, repo-local credential helper). Self-heals on a fresh
      # runner; decoupled from any human dev checkout.
      - name: Bootstrap app repo cache
        id: app-cache
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          repo_path="$(bash "$GITHUB_WORKSPACE/.bugpatrol/tool/examples/github-actions/bugpatrol-cache-bootstrap.sh" "${{ github.repository }}")"
          echo "repo_path=$repo_path" >> "$GITHUB_OUTPUT"

      # Optional: bootstrap each reference repo declared in
      # [[triage.reference_repos]] and collect --reference-repo args. Mirror the
      # app-cache step per reference repo, then pass the paths below. Example:
      #
      # - name: Bootstrap reference repo (backend)
      #   id: ref-backend
      #   shell: bash
      #   env:
      #     GH_TOKEN: ${{ steps.app-token.outputs.token }}
      #   run: |
      #     p="$(bash "$GITHUB_WORKSPACE/.bugpatrol/tool/examples/github-actions/bugpatrol-cache-bootstrap.sh" "${{ github.repository_owner }}/backend")"
      #     echo "path=$p" >> "$GITHUB_OUTPUT"

      # All credentials come from the workflow, not the runner box:
      #   - GH_TOKEN: the minted app token (issue/comment/field writes + the
      #     on-demand private branch fetch inside branch resolution).
      #   - DEEPSEEK_API_KEY / LARK_APP_SECRET: read from os.environ by the code;
      #     injected here as Actions secrets so nothing lives in the runner .env.
      - name: Run triage
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUGPATROL_PROJECT_CONFIG: ${{ vars.BUGPATROL_PROJECT_CONFIG }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
        run: |
          # bugpatrol needs Python >= 3.11 (stdlib tomllib). A runner's default
          # `python3` is often 3.9, so select a 3.11+ interpreter explicitly
          # instead of assuming `python3` qualifies.
          PY=""
          for c in python3.13 python3.12 python3.11 python3; do
            if command -v "$c" >/dev/null 2>&1 \
              && "$c" -c 'import sys; raise SystemExit(0 if sys.version_info >= (3, 11) else 1)'; then
              PY="$c"; break
            fi
          done
          [ -n "$PY" ] || { echo "no Python >= 3.11 on this runner" >&2; exit 1; }
          PYTHONPATH="$GITHUB_WORKSPACE/.bugpatrol/tool" \
          "$PY" -m bugpatrol run-triage "$BUGPATROL_PROJECT_CONFIG" \
            --issue "${{ inputs.issue_number }}" \
            --repo-path "${{ steps.app-cache.outputs.repo_path }}" \
            --output-dir "$GITHUB_WORKSPACE/.bugpatrol/runs/issue-${{ inputs.issue_number }}" \
            --execute
            # For reference repos, append one flag per declared repo, e.g.
            # --reference-repo "${{ github.repository_owner }}/backend=${{ steps.ref-backend.outputs.path }}"
