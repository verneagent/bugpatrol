github_repo = "example-org/example-app"

[lark]
chat_id = "oc_example"
app_id = "cli_example"
app_secret_env = "EXAMPLE_LARK_APP_SECRET"
bot_open_id = "ou_example_bot"
message_url_template = "https://applink.larksuite.com/client/chat/open?openChatId={chat_id}&messageId={message_id}"

[lark.sender_names]
cli_external_reporter = "External Reporter Bot"
ou_example_user = "Example QA"

[triage_agent]
provider = "codex"
runner_labels = ["self-hosted", "bugpatrol-example-triage"]
model = ""
effort = ""

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
cache_path = "docs/prd"
include_globs = ["specs/**/spec.md", "changes/**/prd-snapshot.md"]

[intake]
language = "zh-CN"

[assets]
github_repo = "example-org/example-assets"
checkout_path = "~/example-assets"
base_path = ".github/issue-assets"
branch = "main"
remote_url = "https://github.com/example-org/example-assets.git"

# Branch attribution rules for the target project repo.
# `allowed` entries are fnmatch patterns; triage may only attribute a bug to a
# branch matching one of them (or leave it unknown).
[branches]
default = "main"
allowed = ["main", "post", "chat-live", "feature-*"]

[media]
description_command = [
  "python3",
  "-m",
  "bugpatrol.media_vision",
  "{path}",
  "Describe the bug-relevant UI state, actions, error messages, and abnormal behavior.",
]
description_timeout_seconds = 300
description_retries = 2
description_retry_backoff_seconds = 1.0
redaction_command = []
redaction_timeout_seconds = 300
resize_max_image_width = 1600
resize_max_image_height = 1600
resize_image_quality = 85
max_image_bytes = 10485760
max_video_bytes = 104857600
max_file_bytes = 52428800
max_video_duration_seconds = 120
video_probe_command = []
video_probe_timeout_seconds = 30
video_frame_command = []
video_frame_timeout_seconds = 300
video_frame_min_duration_seconds = 0

[owners]
default = ["@example-triage"]

[owners.paths]
"src/auth/**" = ["@example-auth-owner"]

[owners.capabilities]
Quest = ["@example-quest-owner"]

[followup_classifier]
acknowledgement_texts = ["received"]
fix_status_keywords = ["released"]

[issue_field_names]
Priority = "Priority"
"Triage status" = "Triage status"
Source = "Source"
"Intake version" = "Intake version"
"Triage verdict" = "Triage verdict"
Platform = "Platform"
Reproducibility = "Reproducibility"
"Other platforms" = "Other platforms"
Capability = "Capability"
Evidence = "Evidence"
"PRD status" = "PRD status"
"Triage confidence" = "Triage confidence"
"Owner reason" = "Owner reason"
# Optional text field for best-effort regression blame suggestions.
# Blame = "Blame"
# Optional text field for the branch the bug was observed on.
# "Affected branch" = "Affected branch"
