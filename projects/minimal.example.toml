github_repo = "example-org/example-app"

[lark]
chat_id = "oc_example"
app_id = "cli_example"
app_secret_env = "EXAMPLE_LARK_APP_SECRET"
bot_open_id = "ou_example_bot"

[triage_agent]
provider = "codex"
runner_labels = ["self-hosted"]

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
