github_repo = "example-org/example-app"

[lark]
chat_id = "oc_example"
app_id = "cli_example"
app_secret_env = "EXAMPLE_LARK_APP_SECRET"
bot_open_id = "ou_example_bot"
# Optional. Supports {chat_id}, {root_id}, and {message_id}.
# message_url_template = "https://applink.larksuite.com/client/chat/open?openChatId={chat_id}&messageId={message_id}"

[triage_agent]
provider = "codex"
runner_labels = ["self-hosted"]

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
cache_path = "docs/prd"

[intake]
language = "zh-CN"

# Optional. Branch attribution rules (fnmatch patterns). Defaults to main only.
# [branches]
# default = "main"
# allowed = ["main", "post", "chat-live", "feature-*"]

[issue_field_names]
Priority = "Priority"
"Triage status" = "Triage status"
Source = "Source"
"Intake version" = "Intake version"
"Triage verdict" = "Triage verdict"
Platform = "Platform"
Reproducibility = "Reproducibility"
"Other platforms" = "Other platforms"
Capability = "Capability"
Evidence = "Evidence"
"PRD status" = "PRD status"
"Triage confidence" = "Triage confidence"
"Owner reason" = "Owner reason"
# Optional text field for best-effort regression blame suggestions.
# Blame = "Blame"
# Optional text field for the branch the bug was observed on.
# "Affected branch" = "Affected branch"
