github_repo = "TheCloverLab/fived"
# 以 sobit-bot[bot] GitHub App 身份执行所有 gh 操作
github_cli = "~/clover/fived/scripts/gh-as-bot.sh"

[lark]
chat_id = "oc_91575ce4fdfa88ae0e110f04f61bc53a"
app_id = "cli_aac97d050d385ee9"
app_secret_env = "BUGPATROL_LARK_APP_SECRET"
bot_open_id = "ou_cef931fa2df05ca6f8ae80cb2f3e6094"
# 团队用 Lark 国际版客户端；驱动 API 域名与话题链接域名（applink.larksuite.com）
platform = "lark"

# GitHub login -> Lark open_id，用于分诊/追问消息里真正 @ 到人
[lark.user_open_ids]
garlanddiego = "ou_5935e6148d74f4d907c821d151e1bd09"
wind2star = "ou_d9b2bf738170fabc6f01c03906918a25"
jerry-emperor = "ou_27beb065e275d58b7bc3b72a4fba3823"
AndyCokeZero = "ou_5db6d610a1f5fa40cebfc2c297bc81a4"
naohn42 = "ou_64b0e007a0c85d79a0f1ba1c9b5c74a6"
Sobit-Riki = "ou_afdd297fa43ac3e34c2389661f39b713"
TristinMax = "ou_620062e9f017860d0e9676a5268c578b"
SoxiaLiSA = "ou_a1c691f849e65bf147d32c912bc96345"

[triage_agent]
# deepseek: claude CLI + DeepSeek Anthropic 端点（需 DEEPSEEK_API_KEY）
provider = "deepseek"
runner_labels = ["self-hosted", "bugpatrol-fived-triage"]
model = ""
effort = ""

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
cache_path = "openspec"
include_globs = ["specs/**/spec.md", "changes/**/prd-snapshot.md"]

[intake]
language = "zh-CN"
# 只处理 2026-07-06 00:00 (+08:00) 之后的消息；老话题的孤儿回复不建 issue
since = "2026-07-06T00:00:00+08:00"
skip_orphan_replies = true

[assets]
github_repo = "TheCloverLab/fived-assets"
checkout_path = "~/clover/fived-assets"
base_path = ".github/issue-assets"
branch = "main"

[media]
description_command = [
  "python3",
  "-m",
  "bugpatrol.media_vision",
  "{path}",
  "客观描述这个媒体文件中实际可见的内容：所在界面、关键 UI 元素与文字、错误提示或异常状态；视频按时间顺序列出关键画面变化。只陈述看到的事实，不要推测原因、不要做 bug 分析、不要给修复建议。150 字以内。",
]
description_timeout_seconds = 300
resize_max_image_width = 1600
resize_max_image_height = 1600
resize_image_quality = 85
convert_images_to_jpeg = true

[issue_field_names]
Priority = "Priority"
"Triage status" = "Triage status"
Source = "Source"
"Intake version" = "Intake version"
"Triage verdict" = "Triage verdict"
Platform = "Platform"
Reproducibility = "Reproducibility"
"Other platforms" = "Other platforms"
Capability = "Capability"
Evidence = "Evidence"
"PRD status" = "PRD status"
"Triage confidence" = "Triage confidence"
"Owner reason" = "Owner reason"
