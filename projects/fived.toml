github_repo = "TheCloverLab/fived"

[lark]
chat_id = "oc_91575ce4fdfa88ae0e110f04f61bc53a"
app_id = "cli_a9518095a9b8ded3"
app_secret_env = "FIVED_LARK_BUG_APP_SECRET"
bot_open_id = "ou_649aebe71fec53e3c0cafc10fd20ea76"

[triage_agent]
provider = "codex"
runner_labels = ["self-hosted", "fived-triage"]
model = ""
effort = ""

[prd]
root_wiki_node = "U4wvw2k0SildCUkdClOlAXWFgde"
cache_path = "openspec"
include_globs = [
  "specs/**/spec.md",
  "changes/**/prd-snapshot.md",
]

[intake]
language = "zh-CN"

[assets]
github_repo = "TheCloverLab/fived-assets"
checkout_path = "~/clover/fived-assets"
base_path = ".github/issue-assets"
branch = "main"
remote_url = "https://github.com/TheCloverLab/fived-assets.git"

[media]
description_command = [
  "python3",
  "-m",
  "bugpatrol.media_vision",
  "{path}",
  "请描述这个媒体文件中和 bug 复现相关的界面、操作、错误提示、异常状态。视频请按时间顺序概括关键步骤。",
]
description_timeout_seconds = 300

[issue_field_names]
Priority = "Priority"
"Triage status" = "Triage status"
Source = "Source"
"Intake version" = "Intake version"
"Triage verdict" = "Triage verdict"
Platform = "Platform"
Reproducibility = "Reproducibility"
"Other platforms" = "Other platforms"
Capability = "Capability"
Evidence = "Evidence"
"PRD status" = "PRD status"
"Triage confidence" = "Triage confidence"
"Owner reason" = "Owner reason"
