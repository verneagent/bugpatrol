[triage_agent]
# deepseek: claude CLI + DeepSeek Anthropic 端点（需 DEEPSEEK_API_KEY）
provider = "deepseek"
runner_labels = ["self-hosted", "bugpatrol-fived-triage"]
model = ""
effort = ""

# Cross-repo reference: fived 前端调用 weaver 后端，分诊时只读引用 weaver。
# 分支默认取主库解析出的目标分支同名分支，weaver 上不存在则静默退回 main。
# 运行侧由 triage workflow 自愈 clone-or-fetch 到 ~/clover/weaver 并经
# --reference-repo 传入（config 声明与 workflow 必须同时在线，否则 fail-loud）。
[[triage.reference_repos]]
repo = "TheCloverLab/weaver"
path = "~/clover/weaver"
purpose = "Go backend for the fived frontend (proto routes, comment/chat permissions, quest errors)"

# Auto-fix runner. The fix agent edits code in a `bugpatrol/fix-issue-N`
# worktree, then this gate runs fived's OWN pre-PR check before opening a PR
# (never merges) — same philosophy as revise/[fix.verify]: we only read the
# project's own gate, not reimplement it. `scripts/preflight.sh lint` is fived's
# canonical pre-push gate in its lightest mode (type check + lint); the heavy
# build/unit/surface + native/web/api/e2e all run on the PR via bugpatrol-pr-ci.yml.
# A fresh worktree has no node_modules and preflight requires it, so `npm ci`
# first (unavoidable — preflight itself refuses to run without node_modules).
[fix.verify]
install = "npm ci --no-audit --no-fund"
preflight = "./scripts/preflight.sh lint"

[fix.gate]
max_diff_lines = 800
max_conflict_files = 5

[prd]
root_wiki_node = "LOCAL_PRD_DOCS"
cache_path = "openspec"
include_globs = ["specs/**/spec.md", "changes/**/prd-snapshot.md"]

[intake]
language = "zh-CN"
# 只处理 2026-07-06 00:00 (+08:00) 之后的消息；老话题的孤儿回复不建 issue
since = "2026-07-06T00:00:00+08:00"
skip_orphan_replies = true

[assets]
github_repo = "TheCloverLab/fived-assets"
checkout_path = "~/clover/fived-assets"
base_path = ".github/issue-assets"
branch = "main"

[media]
description_command = [
  "{python}",
  "-m",
  "bugpatrol.media_vision",
  "{path}",
  "客观描述这个媒体文件中实际可见的内容：所在界面、关键 UI 元素与文字、错误提示或异常状态；视频按时间顺序列出关键画面变化。只陈述看到的事实，不要推测原因、不要做 bug 分析、不要给修复建议。150 字以内。",
]
description_timeout_seconds = 300
resize_max_image_width = 1600
resize_max_image_height = 1600
resize_image_quality = 85
convert_images_to_jpeg = true

[issue_field_names]
Priority = "Priority"
"Triage status" = "Triage status"
Source = "Source"
"Intake version" = "Intake version"
"Triage verdict" = "Triage verdict"
