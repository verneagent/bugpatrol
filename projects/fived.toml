# Branch-scoped topic groups: bugs reported here are analyzed against the
# declared feature branch instead of main.
#
# `feature-*` groups need no entry: CI creates one per branch named exactly
# after it (fived `.github/workflows/bugpatrol-feature-topic.yml`) and the
# watcher discovers them by that name, so a new branch is covered without a
# config edit or a watcher restart. Only groups that break the convention are
# listed -- `2026/chat-live` is the one exception, since its branch is not a
# `feature-*` branch and CI therefore never created a group for it.
[[lark.branch_chats]]
chat_id = "oc_a848d65b8d8f25bbbfdfd6dc8e697e51"
branch = "2026/chat-live"

